<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Calculator Interface</title>
    <link rel = "stylesheet" href="styletaxin.css">
    
</head>
<body>

    <div class="nav-wrapper">
        <nav>
            <div class="nav-left">
                <a href="about.html">Home</a>
                <a href="taxinput.html">Tax Calculation</a>
                <a href="#">Terms</a>
            </div>
            <div class="nav-right">
                <a href="profile.html">Profile</a>
            </div>
        </nav>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab(event, 'income')">Income details</button>
            <button class="tab-btn" onclick="openTab(event, 'deduction')">Deduction</button>
        </div>

        <div id="income" class="tab-content active">
            <div class="input-group">
                <div class="label-wrapper"><label>Annual gross salary</label></div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id="grossSalary">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper"><label>City Type</label></div>
                <div class="input-wrapper" style="padding-left: 10px;">
                    <select id="citySelect">
                        <option value="metro">Metro</option>
                        <option value="non-metro">Non-Metro</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label>Income from interest</label>
                    <span class="info-icon" data-tooltip="Includes interest from savings bank, deposits and other interest">i</span>
                </div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id="IncFromInterest">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label>Rental income</label>
                    <span class="info-icon" data-tooltip="Annual rent received on let-out">i</span>
                </div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id="RentalInc">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper"><label>Income from digital assets</label></div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id="DigitalInc">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper"><label>Interest on home loan</label></div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id="HomeLoanInc">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper"><label>Professional Tax</label></div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id="ProfTax">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper"><label>Other incomes</label></div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id ="OtherIncome">
                </div>
            </div>

            <div class="footer-actions">
                <button class="btn btn-solid" onclick="document.querySelectorAll('.tab-btn')[1].click()">Continue</button>
            </div>
        </div>

        <div id="deduction" class="tab-content">
            <div class="input-group">
                <div class="label-wrapper">
                    <label>Basic deductions - 80C</label>
                    <span class="info-icon" data-tooltip="Amount invested/paid in tax saving instruments such as PPF, ELSS mutual funds, LIC premium, etc. (max: 1.5L)">i</span>
                </div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id ="BasicDed">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label>Medical insurance - 80D</label>
                    <span class="info-icon" data-tooltip="Medical premium & preventive health checkup fees paid for self & family including parents">i</span>
                </div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id ="MedInsurance">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label>Interest on housing loan - 80EEA</label>
                    <span class="info-icon" data-tooltip="Amount of interest paid on housing loan sanctioned during FY 2022-2023 (max: 1.5L)">i</span>
                </div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id ="HousingLoan">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label>NPS - 80CCD</label>
                    <span class="info-icon" data-tooltip="Amount of contributions made to the National Pension Scheme (NPS) under Section 80CCD">i</span>
                </div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id ="NPS">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label>Donations to charity - 80G</label>
                    <span class="info-icon" data-tooltip="Amount paid as donation to charitable insitutions or certain recognized funds">i</span>
                </div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id ="Charity">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label>Any other deduction</label>
                    <span class="info-icon" data-tooltip="Enter the deduction amount to be claimed under any other sections not listed above">i</span>
                </div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id="OtherDed">
                </div>
            </div>

            <div class="footer-actions">
                <button class="btn btn-outline" onclick="document.querySelectorAll('.tab-btn')[0].click()">Back</button>
                <button class="btn btn-solid" id="calc-btn">View Calculation</button>
            </div>
        </div>
    </div>

    <script>
        function openTab(evt, tabName) {
            var i, tabContent, tabBtns;
            tabContent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabContent.length; i++) tabContent[i].classList.remove("active");
            tabBtns = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tabBtns.length; i++) tabBtns[i].classList.remove("active");
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        document.querySelectorAll('.comma-input').forEach(input => {
            input.addEventListener('input', function(e) {
                let value = e.target.value.replace(/,/g, '');
                if (!value) { e.target.value = ''; return; }
                let x = value.toString();
                let lastThree = x.substring(x.length - 3);
                let otherNumbers = x.substring(0, x.length - 3);
                if (otherNumbers != '') lastThree = ',' + lastThree;
                let res = otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + lastThree;
                e.target.value = res;
            });
        });
    </script>
</body>
</html>
