<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Calculator Interface</title>
    <link rel = "stylesheet" src="sty">
    <style>
        :root {
            --primary-brown: #6D4C41;
            --secondary-brown: #8D6E63;
            --accent-tan: #D7CCC8;
            --bg-neutral: #FDFBF9;
            --text-main: #3E2723;
            --border-color: #E0D7D5;
            --white: #ffffff;
            /* Colors from About Page */
            --nav-text: #544C43;
            --nav-hover: #2E2A24;
            --nav-border: #E6E1DA;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-neutral);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Unified Navigation Bar (About Page Style) --- */
        .nav-wrapper {
            width: 100%;
            background-color: var(--white);
            border-bottom: 1px solid var(--nav-border);
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        nav {
            width: 100%;
            max-width: 1100px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left { display: flex; gap: 30px; }

        .nav-left a, .nav-right a {
            color: var(--nav-text);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s ease;
            padding: 6px 4px;
            border-bottom: 2px solid transparent;
        }

        .nav-left a:hover, .nav-right a:hover {
            color: var(--nav-hover);
            border-bottom: 2px solid #8C857B;
        }

        /* --- Form Container --- */
        .container {
            width: 90%;
            max-width: 850px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(62, 39, 35, 0.08);
            border: 1px solid var(--border-color);
            margin-bottom: 50px;
            /* overflow: hidden removed to prevent tooltip clipping */
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid var(--accent-tan);
            background: #fff;
            border-radius: 12px 12px 0 0;
            overflow: hidden;
        }

        .tab-btn {
            flex: 1;
            padding: 18px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: var(--secondary-brown);
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--primary-brown);
            border-bottom: 4px solid var(--primary-brown);
        }

        .tab-content {
            display: none;
            padding: 30px;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group { display: flex; flex-direction: column; position: relative; }

        .label-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: var(--primary-brown);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }

        .input-wrapper:focus-within { border-color: var(--primary-brown); }

        .currency-symbol {
            background: #F5F1F0;
            padding: 10px 15px;
            border-right: 1px solid var(--border-color);
            color: var(--secondary-brown);
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: none;
            outline: none;
            font-size: 15px;
            color: var(--text-main);
            background: transparent;
        }

        /* --- TOOLTIP FIX --- */
        .info-icon {
            width: 18px;
            height: 18px;
            background: var(--accent-tan);
            color: var(--primary-brown);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-style: italic;
            cursor: help;
            position: relative;
        }

        .info-icon::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 140%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-brown);
            color: white;
            padding: 10px;
            border-radius: 6px;
            width: 200px;
            font-size: 12px;
            font-style: normal;
            z-index: 99;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* Right-side alignment fix for tooltips */
        .tab-content .input-group:nth-child(even) .info-icon::after {
            left: auto;
            right: 0;
            transform: translateX(10%);
        }

        .info-icon:hover::after {
            opacity: 1;
            visibility: visible;
        }

        .footer-actions {
            grid-column: span 2;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary-brown);
            color: var(--primary-brown);
        }

        .btn-solid {
            background: var(--primary-brown);
            border: none;
            color: white;
        }

        @media (max-width: 768px) {
            nav { flex-direction: column; gap: 15px; text-align: center; }
            .nav-left { flex-direction: column; gap: 12px; }
            .tab-content.active { grid-template-columns: 1fr; }
            .footer-actions { grid-column: span 1; flex-direction: column; }
            /* Reset tooltips for mobile single column */
            .tab-content .input-group:nth-child(even) .info-icon::after {
                left: 50%; right: auto; transform: translateX(-50%);
            }
        }
    </style>
</head>
<body>

    <div class="nav-wrapper">
        <nav>
            <div class="nav-left">
                <a href="about.html">Home</a>
                <a href="taxinput.html">Tax Calculation</a>
                <a href="#">Terms</a>
            </div>
            <div class="nav-right">
                <a href="profile.html">Profile</a>
            </div>
        </nav>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab(event, 'income')">Income details</button>
            <button class="tab-btn" onclick="openTab(event, 'deduction')">Deduction</button>
        </div>

        <div id="income" class="tab-content active">
            <div class="input-group">
                <div class="label-wrapper"><label>Annual gross salary</label></div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id="grossSalary">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper"><label>City Type</label></div>
                <div class="input-wrapper" style="padding-left: 10px;">
                    <select id="citySelect">
                        <option value="metro">Metro</option>
                        <option value="non-metro">Non-Metro</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label>Income from interest</label>
                    <span class="info-icon" data-tooltip="Includes interest from savings bank, deposits and other interest">i</span>
                </div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id="IncFromInterest">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label>Rental income</label>
                    <span class="info-icon" data-tooltip="Annual rent received on let-out">i</span>
                </div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id="RentalInc">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper"><label>Income from digital assets</label></div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id="DigitalInc">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper"><label>Interest on home loan</label></div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id="HomeLoanInc">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper"><label>Professional Tax</label></div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id="ProfTax">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper"><label>Other incomes</label></div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id ="OtherIncome">
                </div>
            </div>

            <div class="footer-actions">
                <button class="btn btn-solid" onclick="document.querySelectorAll('.tab-btn')[1].click()">Continue</button>
            </div>
        </div>

        <div id="deduction" class="tab-content">
            <div class="input-group">
                <div class="label-wrapper">
                    <label>Basic deductions - 80C</label>
                    <span class="info-icon" data-tooltip="Amount invested/paid in tax saving instruments such as PPF, ELSS mutual funds, LIC premium, etc. (max: 1.5L)">i</span>
                </div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id ="BasicDed">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label>Medical insurance - 80D</label>
                    <span class="info-icon" data-tooltip="Medical premium & preventive health checkup fees paid for self & family including parents">i</span>
                </div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id ="MedInsurance">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label>Interest on housing loan - 80EEA</label>
                    <span class="info-icon" data-tooltip="Amount of interest paid on housing loan sanctioned during FY 2022-2023 (max: 1.5L)">i</span>
                </div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id ="HousingLoan">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label>NPS - 80CCD</label>
                    <span class="info-icon" data-tooltip="Amount of contributions made to the National Pension Scheme (NPS) under Section 80CCD">i</span>
                </div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id ="NPS">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label>Donations to charity - 80G</label>
                    <span class="info-icon" data-tooltip="Amount paid as donation to charitable insitutions or certain recognized funds">i</span>
                </div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id ="Charity">
                </div>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label>Any other deduction</label>
                    <span class="info-icon" data-tooltip="Enter the deduction amount to be claimed under any other sections not listed above">i</span>
                </div>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="text" class="comma-input" placeholder="0" id="OtherDed">
                </div>
            </div>

            <div class="footer-actions">
                <button class="btn btn-outline" onclick="document.querySelectorAll('.tab-btn')[0].click()">Back</button>
                <button class="btn btn-solid" id="calc-btn">View Calculation</button>
            </div>
        </div>
    </div>

    <script>
        function openTab(evt, tabName) {
            var i, tabContent, tabBtns;
            tabContent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabContent.length; i++) tabContent[i].classList.remove("active");
            tabBtns = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tabBtns.length; i++) tabBtns[i].classList.remove("active");
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        document.querySelectorAll('.comma-input').forEach(input => {
            input.addEventListener('input', function(e) {
                let value = e.target.value.replace(/,/g, '');
                if (!value) { e.target.value = ''; return; }
                let x = value.toString();
                let lastThree = x.substring(x.length - 3);
                let otherNumbers = x.substring(0, x.length - 3);
                if (otherNumbers != '') lastThree = ',' + lastThree;
                let res = otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + lastThree;
                e.target.value = res;
            });
        });
    </script>
</body>
</html>
