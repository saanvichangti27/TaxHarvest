<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxHarvest - Tax Calculation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7f5f0; /* Soft warm beige background */
            color: #4a4740;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        /* Full-width container specifically for the Navigation Bar */
        .nav-wrapper {
            width: 100%;
            background-color: #ffffff; /* White navbar background spanning edge-to-edge */
            border-bottom: 1px solid #e6e1da;
            display: flex;
            justify-content: center; /* Centers the inner navbar content */
            margin-bottom: 40px;
        }

        /* Matches max-width precisely with firstpage.html for seamless transition */
        nav {
            width: 100%;
            max-width: 1100px; 
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            display: flex;
            gap: 30px; /* Spacing between Home, Tax Calculation, Terms */
        }

        .nav-left a, .nav-right a {
            color: #544c43; /* Medium warm brown text */
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: color 0.2s ease;
            padding: 6px 4px;
            border-bottom: 2px solid transparent;
        }

        .nav-left a:hover, .nav-right a:hover {
            color: #2e2a24; /* Rich dark espresso brown */
            border-bottom: 2px solid #8c857b;
        }

        /* Layout wrapper for the main content area */
        .wrapper {
            width: 100%;
            max-width: 1100px; /* Kept at 1100px outer box to align beautifully below the matched navbar width */
            padding: 0 20px;
            margin-bottom: 40px;
        }

        /* Tax Calculation Card Container */
        .calculation-section {
            background-color: #ffffff;
            border: 1px solid #e6e1da;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(61, 55, 48, 0.04);
        }

        /* Cleaned Header layout */
        .section-header {
            margin-bottom: 30px;
            border-bottom: 2px solid #f7f5f0;
            padding-bottom: 15px;
        }

        .section-header h2 {
            font-size: 1.8rem;
            color: #3d3730;
            font-weight: 700;
        }

        /* Two-column grid matching layout */
        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px 40px;
            margin-bottom: 35px; /* Added spacing before the button wrapper */
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #706960; /* Earthy medium brown */
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 12px;
            border: 1px solid #d1cac0; /* Beige-gray border */
            border-radius: 6px;
            font-size: 1rem;
            background-color: #faf9f6; /* Off-white block interior */
            color: #3d3730;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #8c857b;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(140, 133, 123, 0.15);
        }

        .input-group input::placeholder {
            color: #a39c93; /* Muted brown-gray placeholder */
        }

        /* Flex container to hold the button centered at the bottom */
        .btn-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        /* Espresso Brown Calculate Action Button */
        .calc-btn {
            padding: 14px 50px;
            background-color: #544c43; /* Deep warm brown */
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .calc-btn:hover {
            background-color: #3d3730;
        }

        /* Responsive adjustments for mobile screens */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 15px;
                text-align: center;
                padding: 15px;
            }
            .nav-left {
                flex-direction: column;
                gap: 12px;
            }
            .calc-btn {
                width: 100%;
            }
            .calc-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="nav-wrapper">
        <nav>
            <div class="nav-left">
                <a href="about.html">Home</a>
                <a href="taxinput.html">Tax Calculation</a>
                <a href="#">Terms</a>
            </div>
            <div class="nav-right">
                <a href="profile.html">Profile</a>
            </div>
        </nav>
    </div>

    <div class="wrapper">
        <section class="calculation-section">
            <form action="/calculate-tax" method="POST">
                
                <div class="section-header">
                    <h2>Tax calculation</h2>
                </div>

                <div class="calc-grid">
                    
                    <div class="input-group">
                        <label for="grossSalary">ANNUAL GROSS SALARY (₹)</label>
                        <input type="number" id="grossSalary" name="grossSalary" placeholder="e.g. 1200000" min="0" required>
                    </div>

                    <div class="input-group">
                        <label for="cityType">CITY TYPE</label>
                        <select id="cityType" name="cityType">
                            <option value="metro">Metro city</option>
                            <option value="non-metro">Non-metro city</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="hraReceived">MONTHLY HRA RECEIVED (₹)</label>
                        <input type="number" id="hraReceived" name="hraReceived" placeholder="e.g. 20000" min="0">
                    </div>

                    <div class="input-group">
                        <label for="rentPaid">MONTHLY RENT PAID (₹)</label>
                        <input type="number" id="rentPaid" name="rentPaid" placeholder="e.g. 15000" min="0">
                    </div>

                    <div class="input-group">
                        <label for="investment80c">80C INVESTMENTS/YR (₹)</label>
                        <input type="number" id="investment80c" name="investment80c" placeholder="e.g. 50000" min="0">
                    </div>

                    <div class="input-group">
                        <label for="healthInsurance">HEALTH INSURANCE/YR (₹)</label>
                        <input type="number" id="healthInsurance" name="healthInsurance" placeholder="e.g. 12000" min="0">
                    </div>

                    <div class="input-group">
                        <label for="homeLoan">HOME LOAN INTEREST/YR (₹)</label>
                        <input type="number" id="homeLoan" name="homeLoan" placeholder="e.g. 0" min="0">
                    </div>

                    <div class="input-group">
                        <label for="npsContribution">NPS CONTRIBUTION/YR (₹)</label>
                        <input type="number" id="npsContribution" name="npsContribution" placeholder="e.g. 0" min="0">
                    </div>

                </div>

                <div class="btn-container">
                    <button type="submit" class="calc-btn">Calculate</button>
                </div>

            </form>
        </section>
    </div>

</body>
</html>
