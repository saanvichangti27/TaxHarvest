<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxHarvest - Tax Calculation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7f5f0; /* Soft warm beige background */
            color: #4a4740;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 900px;
            background: transparent;
        }

        /* Top Header Banner */
        header {
            background-color: #ffffff; /* White Header banner */
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            border: 1px solid #e6e1da;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.3rem;
            color: #2e2a24; /* Rich dark espresso brown */
            font-weight: 600;
        }

        /* Tax Calculation Card Container */
        .calculation-section {
            background-color: #ffffff;
            border: 1px solid #e6e1da;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(61, 55, 48, 0.04);
        }

        /* Flex header to position the button on top right */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #f7f5f0;
            padding-bottom: 15px;
        }

        .section-header h2 {
            font-size: 1.8rem;
            color: #3d3730;
            font-weight: 700;
        }

        /* Espresso Brown Calculate Action Button */
        .calc-btn {
            padding: 12px 35px;
            background-color: #544c43; /* Deep warm brown */
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .calc-btn:hover {
            background-color: #3d3730;
        }

        /* Two-column grid matching user image layout */
        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px 40px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #706960; /* Earthy medium brown */
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 12px;
            border: 1px solid #d1cac0; /* Beige-gray border */
            border-radius: 6px;
            font-size: 1rem;
            background-color: #faf9f6; /* Off-white block interior */
            color: #3d3730;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #8c857b;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(140, 133, 123, 0.15);
        }

        .input-group input::placeholder {
            color: #a39c93; /* Muted brown-gray placeholder */
        }

        /* Responsive adjustments for mobile screens */
        @media (max-width: 768px) {
            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .calc-btn {
                width: 100%;
            }
            .calc-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <h1>TaxHarvest</h1>
        </header>

        <section class="calculation-section">
            <form action="/calculate-tax" method="POST">
                
                <div class="section-header">
                    <h2>Tax calculation</h2>
                    <button type="submit" class="calc-btn">Calculate</button>
                </div>

                <div class="calc-grid">
                    
                    <div class="input-group">
                        <label for="grossSalary">ANNUAL GROSS SALARY (₹)</label>
                        <input type="number" id="grossSalary" name="grossSalary" placeholder="e.g. 1200000" min="0" required>
                    </div>

                    <div class="input-group">
                        <label for="cityType">CITY TYPE</label>
                        <select id="cityType" name="cityType">
                            <option value="metro">Metro city</option>
                            <option value="non-metro">Non-metro city</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="hraReceived">MONTHLY HRA RECEIVED (₹)</label>
                        <input type="number" id="hraReceived" name="hraReceived" placeholder="e.g. 20000" min="0">
                    </div>

                    <div class="input-group">
                        <label for="rentPaid">MONTHLY RENT PAID (₹)</label>
                        <input type="number" id="rentPaid" name="rentPaid" placeholder="e.g. 15000" min="0">
                    </div>

                    <div class="input-group">
                        <label for="investment80c">80C INVESTMENTS/YR (₹)</label>
                        <input type="number" id="investment80c" name="investment80c" placeholder="e.g. 50000" min="0">
                    </div>

                    <div class="input-group">
                        <label for="healthInsurance">HEALTH INSURANCE/YR (₹)</label>
                        <input type="number" id="healthInsurance" name="healthInsurance" placeholder="e.g. 12000" min="0">
                    </div>

                    <div class="input-group">
                        <label for="homeLoan">HOME LOAN INTEREST/YR (₹)</label>
                        <input type="number" id="homeLoan" name="homeLoan" placeholder="e.g. 0" min="0">
                    </div>

                    <div class="input-group">
                        <label for="npsContribution">NPS CONTRIBUTION/YR (₹)</label>
                        <input type="number" id="npsContribution" name="npsContribution" placeholder="e.g. 0" min="0">
                    </div>

                </div>
            </form>
        </section>
    </div>

</body>
</html>
